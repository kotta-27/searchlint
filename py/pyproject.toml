[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchlint"
version = "0.1.0"
description = "Lint for retrieval: golden queries, recall/MRR/nDCG, a CI gate, and an MCP server over the same index."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "faiss-cpu",
  "janome",
  "httpx",
  "pypdf",
  "pyyaml",
  "mcp>=2",
]

[project.scripts]
searchlint = "searchlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
